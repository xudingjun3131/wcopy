<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-page-node-id="nfvEQ03z0JVfi5CVZR643l">
<head data-page-node-id="JzvPQyH88EYQA8WnNDZOHT">
  <meta charset="UTF-8" data-page-node-id="UzZXJrxRnzAl3xDzP2tgH7">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="iH3RLb5xMYIbQqKELXJQ0H">
  <title>wcopy</title>
  <link rel="stylesheet" href="styles.css" data-page-node-id="BVOUihYcncDBld3eHTPRWh">
</head>
<body data-page-node-id="jNcSKnUFjF26wfqatQsP0s">
  <div class="app" data-page-node-id="6PGy7zW6B0tZWCCfS6kxWk">
    <!-- 标题栏：搜索（默认收起）+ 筛选 tab（全部/文本/图片/文件/链接/收藏）+ 视图 + 窗口按钮，同一行；应用名移到设置面板 -->
    <div class="titlebar">
      <div class="titlebar-search" id="titlebarSearch">
        <button class="search-toggle" id="searchToggle" title="搜索">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
        </button>
        <div class="search-box" id="searchBox">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
          <input type="text" id="searchInput" placeholder="搜索剪贴板历史...  (Ctrl+K)" autocomplete="off">
        </div>
      </div>
      <div class="filter-tabs" id="filterTabs">
        <button class="tab active" data-type="all">全部</button>
        <button class="tab" data-type="text">文本</button>
        <button class="tab" data-type="image">图片</button>
        <button class="tab" data-type="file">文件</button>
        <button class="tab" data-type="link">链接</button>
        <button class="tab" data-type="favorite">收藏</button>
      </div>
      <div class="titlebar-right">
        <div class="view-options">
          <button class="view-btn active" title="网格视图">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7" rx="1"/>
              <rect x="14" y="3" width="7" height="7" rx="1"/>
              <rect x="3" y="14" width="7" height="7" rx="1"/>
              <rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
          </button>
          <button class="view-btn" title="列表视图">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
        </div>
        <span class="title-count" id="resultCount">加载中...</span>
        <button class="window-btn settings-toggle" id="settingsBtn" title="设置">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <button class="window-btn theme-toggle" id="themeToggle" title="切换主题">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
        <button class="window-btn minimize" id="minimizeBtn" title="最小化">—</button>
        <button class="window-btn close" id="closeBtn" title="关闭">✕</button>
      </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-content" data-page-node-id="inxle8NAbTR8HPsi6zLaZb">
      <div class="list-header" data-page-node-id="YBBo284cHeWBPhPK7IjcW5">
        <span id="statusText" data-page-node-id="ad7BWNkLDvXEHPnSUkLSNE"></span>
      </div>
      <div class="card-grid" id="cardGrid" data-page-node-id="EG7DIQh3vaV0kINDGYv9BL"></div>
      <div class="empty-state" id="emptyState" style="display: none;" data-page-node-id="IyLyQCWcsXSnAuwjEmDxIG">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-page-node-id="0L3FBc0UrGTkvESaLEjrSk">
          <rect x="6" y="4" width="12" height="16" rx="2" data-page-node-id="9p2NTLamBBh7jC2igRxoV1"/>
          <path d="M9 9h6M9 13h6M9 17h4" stroke-linecap="round" data-page-node-id="wVQFzxCxDsXFDgS1PYJR0i"/>
        </svg>
        <p data-page-node-id="UT6RywJBcTFYxiAMlsNtQo">没有找到匹配的历史记录</p>
        <span data-page-node-id="DCAzbc6rVSy8mmzhLcheXH">复制点东西，它就会出现在这里</span>
      </div>
    </div>

    <!-- 底部状态栏：后端连接/最近捕获状态 + 快捷键提示 -->
    <div class="statusbar" data-page-node-id="7OBCmmlVcthpV2jc3Co6yA">
      <span class="backend-badge" id="backendBadge">连接中…</span>
      <span class="shortcut-hint" id="shortcutHint" data-page-node-id="NGy8SBizyhXLFsLNllhFNL">Ctrl+Shift+V 唤起 · 双击粘贴</span>
    </div>
  </div>

  <!-- 设置面板 -->
  <div class="settings-overlay" id="settingsOverlay" style="display:none;">
    <div class="settings-panel">
      <div class="settings-header">
        <div class="settings-brand">
          <img src="assets/logo.png" alt="wcopy" width="18" height="18" class="logo-img">
          <span class="brand-name">wcopy</span>
          <span class="brand-divider">·</span>
          <span>设置</span>
        </div>
        <button class="window-btn" id="settingsClose">✕</button>
      </div>
      <div class="settings-body">
        <div class="setting-row">
          <div class="setting-label">
            <span>开机自动启动</span>
            <small>登录 Windows 后自动在后台运行</small>
          </div>
          <label class="switch">
            <input type="checkbox" id="setLaunchAtLogin">
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <div class="setting-label">
            <span>保留条数（最大历史条数）</span>
            <small>超出后自动清理最早的非收藏记录，重启后仍生效</small>
          </div>
          <div class="setting-control">
            <input type="range" id="setMaxItems" min="50" max="1000" step="50">
            <span id="setMaxItemsVal" class="setting-val">200</span>
          </div>
        </div>
        <div class="setting-row">
          <div class="setting-label">
            <span>弹窗弹出方向</span>
            <small>紧贴对应屏幕边缘显示</small>
          </div>
          <div class="setting-control">
            <select id="setPopupPosition">
              <option value="left">左侧</option>
              <option value="right">右侧</option>
              <option value="top">顶部</option>
              <option value="bottom">底部</option>
            </select>
          </div>
        </div>
        <div class="setting-row">
          <div class="setting-label">
            <span>弹窗快捷键</span>
            <small>全局唤起 wcopy 的快捷键（点击录制后按下组合键）</small>
          </div>
          <div class="setting-control">
            <span id="popupShortcutText" class="setting-val shortcut-display">Ctrl+Shift+V</span>
            <button class="btn-record" id="recordShortcutBtn">录制</button>
          </div>
        </div>
        <div class="setting-row">
          <div class="setting-label">
            <span>清除历史时保留收藏</span>
            <small>清空只删除未收藏且未置顶的记录</small>
          </div>
          <label class="switch">
            <input type="checkbox" id="setRetainFav">
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-actions">
          <button class="btn-danger" id="clearAllBtn">清除全部历史（保留收藏）</button>
        </div>
        <div class="setting-about">
          <span id="appVersionText">wcopy</span>
        </div>
      </div>
    </div>
  </div>

  <script src="wcopy-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
