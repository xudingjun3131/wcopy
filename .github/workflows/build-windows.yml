name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build wcopy installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer (.exe)
        id: nsis
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          npx electron-builder --win --x64 nsis 2>&1 | tee nsis.log

      - name: Build MSI installer (.msi)
        id: msi
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          npx electron-builder --win --x64 msi 2>&1 | tee msi.log

      - name: Stage & list dist
        shell: bash
        run: |
          { echo "# wcopy CI build ${{ github.run_number }}"; echo; echo '## dist listing:'; ls -la dist 2>&1; } > release_notes.md
          cat release_notes.md

      - name: Upload installers to GitHub Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-build-${{ github.run_number }}
          name: wcopy CI build #${{ github.run_number }}
          body_path: release_notes.md
          files: |
            dist/**/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
