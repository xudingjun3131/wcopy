name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build wcopy installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer (.exe)
        id: nsis
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          npx electron-builder --win --x64 nsis 2>&1 | tee nsis.log

      - name: Build MSI installer (.msi)
        id: msi
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          npx electron-builder --win --x64 msi 2>&1 | tee msi.log

      - name: List dist output
        if: always()
        shell: bash
        run: ls -la dist 2>&1 || echo "no dist dir"

      - name: Upload installers to GitHub Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-build-${{ github.run_number }}
          name: wcopy CI build #${{ github.run_number }}
          files: |
            dist/wcopy-setup-*.exe
            dist/wcopy-*.msi
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload NSIS artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wcopy-installer
          path: dist/*-setup-*.exe
          if-no-files-found: ignore

      - name: Upload MSI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wcopy-msi
          path: dist/*.msi
          if-no-files-found: ignore
