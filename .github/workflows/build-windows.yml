name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build wcopy installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer (.exe)
        id: nsis
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          npx electron-builder --win --x64 nsis 2>&1 | tee nsis.log

      - name: Build MSI installer (.msi)
        id: msi
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          npx electron-builder --win --x64 msi 2>&1 | tee msi.log

      - name: Publish build logs to ci-log branch
        if: always()
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "ci@wcopy.local"
          git config user.name "wcopy CI"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p diag
          cp nsis.log "diag/nsis-${GITHUB_RUN_NUMBER}.log" 2>/dev/null || true
          cp msi.log "diag/msi-${GITHUB_RUN_NUMBER}.log" 2>/dev/null || true
          git add -f diag
          git commit -m "ci diag run ${GITHUB_RUN_NUMBER}" || echo "nothing to commit"
          git push "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" HEAD:ci-log || echo "push failed"

      - name: Upload NSIS installer (.exe)
        if: steps.nsis.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wcopy-installer
          path: dist/*-setup-*.exe
          if-no-files-found: ignore

      - name: Upload MSI installer (.msi)
        if: steps.msi.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wcopy-msi
          path: dist/*.msi
          if-no-files-found: ignore
