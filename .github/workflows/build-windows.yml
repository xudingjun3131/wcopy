name: Build Windows Installer

# 只有打 tag（版本号，形如 v1.1.0）才会触发打包构建。
# 普通 push 到 main 不再触发构建，避免无意义出包。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build wcopy installer (Tauri)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # tag 就是版本号：把 Cargo.toml / package.json 的 version 同步成 tag（去掉 v 前缀）。
      - name: Apply version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version: $VERSION (from tag ${{ github.ref_name }})"
          sed -i.bak -E "s/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          node -e "const f='package.json';const p=require('./'+f);p.version='$VERSION';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Tauri CLI
        run: npm install

      - name: Build installers (NSIS + MSI)
        shell: bash
        run: |
          set -o pipefail
          npx tauri build 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: List bundle output
        if: success()
        shell: bash
        run: |
          echo "=== bundle dir ==="
          ls -laR src-tauri/target/release/bundle 2>/dev/null || echo "no bundle dir"

      - name: Stage release notes
        if: success()
        shell: bash
        run: |
          {
            echo "# wcopy ${{ github.ref_name }}"
            echo
            echo "Tauri / Rust 构建。安装包位于以下文件。"
            echo
            echo '## build.log (tail):'
            tail -40 build.log 2>/dev/null || echo "none"
            echo
            echo '## bundle artifacts:'
            ls -la src-tauri/target/release/bundle/nsis 2>/dev/null || true
            ls -la src-tauri/target/release/bundle/wix 2>/dev/null || true
          } > release_notes.md
          cat release_notes.md

      - name: Upload to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: wcopy ${{ github.ref_name }}
          body_path: release_notes.md
          overwrite: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/wix/*.msi
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/**/*.sig
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
