name: Build Windows Installer

# 只有打 tag（版本号，形如 v1.0.1）才会触发打包构建。
# 普通 push 到 main 不再触发构建，避免无意义出包。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build wcopy installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # tag 就是版本号：把 package.json 的 version 同步成 tag（去掉 v 前缀），
      # 这样产物名 / GitHub Release 都跟 tag 一致。
      - name: Apply version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version: $VERSION (from tag ${{ github.ref_name }})"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer (.exe)
        shell: bash
        run: |
          set -o pipefail
          # 只构建 nsis 时，必须把 msi 配置置 null，否则 electron-builder 校验报
          # "configuration.msi should be one of these: null"
          npx electron-builder --win --x64 --config.win.target=nsis --config.msi=null --publish=never 2>&1 | tee nsis.log

      - name: Build MSI installer (.msi)
        shell: bash
        run: |
          set -o pipefail
          # 只构建 msi 时，同理把 nsis 配置置 null
          npx electron-builder --win --x64 --config.win.target=msi --config.nsis=null --publish=never 2>&1 | tee msi.log

      - name: Stage notes with build logs
        if: success()
        shell: bash
        run: |
          {
            echo "# wcopy ${{ github.ref_name }}"
            echo
            echo '## nsis.log (tail):'
            tail -50 nsis.log 2>/dev/null || echo "none"
            echo
            echo '## msi.log (tail):'
            tail -50 msi.log 2>/dev/null || echo "none"
            echo
            echo '## dist exists?'
            ls -la dist 2>&1 || echo "no dist"
          } > release_notes.md
          cat release_notes.md

      - name: Upload to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: wcopy ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            dist/wcopy-setup-*.exe
            dist/wcopy-*.msi
            dist/*.blockmap
            dist/latest.yml
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
